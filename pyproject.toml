[project]
name = "olist-dss"
version = "0.1.0"
description = "E-Commerce Decision Support System on the Olist dataset (BIA 21CSE421T course project)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Streamlit pages put the project root on sys.path before importing `src`/`app`.
"app/**" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["^app/", "^\\.venv/"]

[[tool.mypy.overrides]]
module = ["pandas.*", "pyarrow.*", "sklearn.*", "joblib.*", "vaderSentiment.*", "yaml.*", "pyodbc.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["sql_server: needs a reachable local SQL Server with the loaded database (auto-skipped otherwise)"]
